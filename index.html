<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wordpass – random passphrase generator</title>
  <meta name="description" content="Generate strong, memorable passphrases from random English words. Runs entirely in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>wordpass</h1>
    <p class="sub">Random-word passphrase generator</p>

    <div class="output-wrap">
      <output id="password" class="password" aria-live="polite" role="button" tabindex="0" title="Tap to copy"></output>
      <div class="actions">
        <button id="copy" type="button" class="primary">Copy</button>
        <button id="regen" type="button" class="secondary" aria-label="Generate new password">↻ New</button>
      </div>
    </div>

    <div class="strength" aria-live="polite">
      <div class="bar" role="presentation"><div id="bar-fill"></div></div>
      <div class="strength-text"><strong id="strength-label"></strong> <span id="strength-bits"></span></div>
    </div>

    <div class="controls">
      <div class="row">
        <label for="count">Number of words</label>
        <div class="count-ctl">
          <input id="count" type="range" min="3" max="15" value="4">
          <output id="count-out" for="count">4</output>
        </div>
      </div>

      <fieldset class="row">
        <legend>Separator</legend>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="sep" value="period" checked><span>Periods</span></label>
          <label><input type="radio" name="sep" value="hyphen"><span>Hyphens</span></label>
          <label><input type="radio" name="sep" value="space"><span>Spaces</span></label>
          <label><input type="radio" name="sep" value="comma"><span>Commas</span></label>
          <label><input type="radio" name="sep" value="numbers"><span>Numbers</span></label>
        </div>
      </fieldset>

      <div class="row">
        <label for="caps">Random ALL CAPS words</label>
        <div class="count-ctl">
          <input id="caps" type="range" min="0" max="15" value="0">
          <output id="caps-out" for="caps">0</output>
        </div>
      </div>
      <div class="row">
        <label for="cap">Capitalize words</label>
        <input id="cap" type="checkbox" class="switch">
      </div>
      <div class="row">
        <label for="digit">Add a number at the end</label>
        <input id="digit" type="checkbox" class="switch">
      </div>
    </div>

    <footer>
      Nothing leaves your browser. Words from the
      <a href="https://www.eff.org/deeplinks/2016/07/new-wordlists-random-passphrases">EFF Large Wordlist</a> (CC BY 3.0 US).
      <a href="https://github.com/electricburgers/wordpass">Source</a>
    </footer>
  </main>
  <script src="words.js"></script>
  <script src="gen.js"></script>
  <script src="app.js"></script>
</body>
</html>
